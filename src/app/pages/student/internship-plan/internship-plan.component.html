<!-- Page Header & Status -->
<div class="flex justify-between items-start mb-10">
    <div>
        <h2 class="text-2xl font-bold text-slate-900 mb-2">Lập Kế hoạch Thực tập - TTTN-02</h2>
        <p class="text-sm text-slate-600">Sinh viên điền dự kiến nhiệm vụ thực tập cho 8 tuần.</p>
    </div>
    <div class="flex flex-col items-end gap-2">
        <div class="flex items-center gap-2 px-3 py-1.5 border rounded-full"
             [ngClass]="{
                 'bg-yellow-100 border-yellow-200 text-yellow-700': status.label === 'Chờ duyệt',
                 'bg-green-100 border-green-200 text-green-700': status.label === 'Đã duyệt',
                 'bg-slate-100 border-slate-200 text-slate-700': status.label === 'Chưa nộp' || status.label === 'Chưa có kế hoạch' || status.label === 'Chưa bắt đầu'
             }">
            <span class="w-2 h-2 rounded-full"
                  [ngClass]="{
                      'bg-yellow-500': status.label === 'Chờ duyệt',
                      'bg-green-500': status.label === 'Đã duyệt',
                      'bg-slate-500': status.label === 'Chưa nộp' || status.label === 'Chưa có kế hoạch' || status.label === 'Chưa bắt đầu'
                  }"></span>
            <span class="text-xs font-medium">{{ status.label }}</span>
        </div>
        <p class="text-xs text-slate-500 font-medium">{{ status.message }}</p>
    </div>
</div>

<div *ngIf="isLoading" class="p-12 text-center text-gray-500">
    <span class="material-symbols-outlined animate-spin text-4xl mb-4">autorenew</span>
    <p>Đang tải dữ liệu...</p>
</div>

<!-- Form/Table Area -->
<div *ngIf="!isLoading" class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
    <!-- Messages -->
    <div *ngIf="successMessage" class="p-4 bg-green-50 text-green-700 border-b border-green-100 text-sm font-medium">
        {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="p-4 bg-red-50 text-red-700 border-b border-red-100 text-sm font-medium">
        {{ errorMessage }}
    </div>

    <!-- Table Header -->
    <div class="grid grid-cols-12 gap-4 p-4 border-b border-slate-200 bg-slate-50 font-semibold text-sm text-slate-800">
        <div class="col-span-1">Tuần</div>
        <div class="col-span-4">Tên công việc / Nhiệm vụ</div>
        <div class="col-span-4">Kết quả mong đợi</div>
        <!-- Hide evidences, since we decided to skip or merge it into results. We'll leave the input for expectedResults wider. -->
        <div class="col-span-3 text-center">Ánh xạ CLOs (1-7)</div>
    </div>

    <!-- Weeks List using ngFor -->
    <div *ngFor="let week of weeks; let odd = odd" 
         class="grid grid-cols-12 gap-4 p-4 border-b border-slate-200 items-start"
         [ngClass]="{'bg-white': !odd, 'bg-slate-50/50': odd}">
        
        <div class="col-span-1 font-medium text-sm pt-2">Tuần {{ week.weekNumber }}</div>
        <div class="col-span-4">
            <textarea class="w-full text-sm border-slate-300 rounded focus:ring-blue-600 focus:border-blue-600 disabled:bg-slate-100 disabled:text-slate-500" 
                      placeholder="Nội dung dự kiến tuần {{ week.weekNumber }}..." rows="3" [(ngModel)]="week.tasks" [disabled]="isLocked"></textarea>
        </div>
        <div class="col-span-4">
            <textarea class="w-full text-sm border-slate-300 rounded focus:ring-blue-600 focus:border-blue-600 disabled:bg-slate-100 disabled:text-slate-500" 
                      placeholder="Kết quả tuần {{ week.weekNumber }}..." rows="3" [(ngModel)]="week.expectedResults" [disabled]="isLocked"></textarea>
        </div>
        <div class="col-span-3">
            <div class="grid grid-cols-4 gap-2 pt-1">
                <label *ngFor="let clo of availableClos" class="flex items-center gap-1" [ngClass]="{'cursor-pointer': !isLocked, 'cursor-not-allowed opacity-60': isLocked}">
                    <input class="text-blue-700 border-slate-400 rounded-sm disabled:opacity-60" 
                           type="checkbox"
                           [checked]="hasClo(week, clo)"
                           [disabled]="isLocked"
                           (change)="toggleClo(week, clo)"/>
                    <span class="text-xs">{{ clo }}</span>
                </label>
            </div>
        </div>
    </div>

    <!-- Action row -->
    <div class="p-4 bg-white flex justify-end gap-4 border-t border-slate-200" *ngIf="!isLocked">
        <button (click)="onSubmit()" [disabled]="isSaving" class="px-6 py-2 bg-[#00429D] text-white rounded text-sm font-medium hover:bg-blue-800 transition-colors flex items-center gap-2 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
            <span class="material-symbols-outlined text-[18px]" *ngIf="!isSaving">send</span>
            <span class="material-symbols-outlined text-[18px] animate-spin" *ngIf="isSaving">autorenew</span>
            {{ isSaving ? 'Đang gửi...' : 'Gửi phê duyệt' }}
        </button>
    </div>
</div>
