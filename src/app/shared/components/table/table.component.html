<div class="overflow-x-auto w-full">
  <table class="w-full text-left border-collapse">
    <thead class="bg-[#f3f3fb] border-b border-slate-200">
      <tr>
        <th *ngFor="let col of columns" 
            [class]="'py-3 px-4 font-label-md text-[13px] font-medium text-slate-500 uppercase tracking-wider ' + (col.align === 'center' ? 'text-center' : '')"
            [style.width]="col.width">
          {{ col.label }}
        </th>
      </tr>
    </thead>
    <tbody class="font-body-md text-[14px] text-slate-800 bg-white">
      <!-- Loading indicator -->
      <tr *ngIf="isLoading">
        <td [attr.colspan]="columns.length" class="py-12 text-center text-slate-400">
          <div class="flex items-center justify-center gap-2">
            <span class="animate-spin rounded-full h-5 w-5 border-2 border-indigo-600 border-t-transparent"></span>
            <span>Đang tải dữ liệu...</span>
          </div>
        </td>
      </tr>

      <!-- No data -->
      <tr *ngIf="!isLoading && data.length === 0">
        <td [attr.colspan]="columns.length" class="py-12 text-center text-slate-400">
          <div class="flex flex-col items-center justify-center gap-1">
            <span class="material-symbols-outlined text-[36px] text-slate-300">search_off</span>
            <span>{{ emptyMessage }}</span>
          </div>
        </td>
      </tr>

      <!-- Data rows -->
      <ng-container *ngIf="!isLoading && data.length > 0">
        <tr *ngFor="let item of data; let i = index" class="border-b border-slate-200 hover:bg-slate-50 transition-colors">
          <td *ngFor="let col of columns" 
              [class]="'py-3 px-4 ' + (col.align === 'center' ? 'text-center' : '')">
            
            <!-- Default rendering -->
            <ng-container *ngIf="!customTemplates[col.key]">
              {{ getValue(item, col.key, i) }}
            </ng-container>

            <!-- Custom template rendering -->
            <ng-container *ngIf="customTemplates[col.key]">
              <ng-container *ngTemplateOutlet="customTemplates[col.key]; context: { $implicit: item, index: i }"></ng-container>
            </ng-container>

          </td>
        </tr>
      </ng-container>
    </tbody>
  </table>
</div>
