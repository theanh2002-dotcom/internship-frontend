<div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm relative overflow-hidden transition-all duration-200"
     [class.cursor-pointer]="routerLink"
     [class.hover:bg-slate-50]="routerLink"
     [class.hover:shadow]="!routerLink && icon"
     [ngClass]="borderLeftClass || ''"
     [routerLink]="routerLink ? routerLink : null">
  
  <!-- Absolute left accent line if specified -->
  <div *ngIf="sideAccentColor" 
       class="absolute w-1 h-full top-0 left-0"
       [style.backgroundColor]="sideAccentColor">
  </div>

  <!-- Layout with Icon (Side-by-side) -->
  <div *ngIf="icon" class="flex items-center gap-4">
    <div class="w-12 h-12 rounded-full flex justify-center items-center shrink-0"
         [ngClass]="iconBgClass">
      <span class="material-symbols-outlined text-2xl">{{ icon }}</span>
    </div>
    <div>
      <p class="text-xs font-bold text-slate-400 uppercase tracking-wide">{{ title }}</p>
      <p class="text-2xl font-bold mt-1 text-slate-800" [ngClass]="valueClass">{{ value }}</p>
    </div>
  </div>

  <!-- Simple Centered Layout (No Icon) -->
  <div *ngIf="!icon" class="flex flex-col justify-center items-center text-center">
    <p class="text-slate-500 text-sm font-medium mb-2">{{ title }}</p>
    <p class="text-3xl font-black" [ngClass]="valueClass">{{ value }}</p>
  </div>
</div>
