<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" (click)="onClose()"></div>
  <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl overflow-hidden relative z-10 animate-in fade-in zoom-in-95 duration-200">
    <div class="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
      <h3 class="font-headline-md text-[16px] font-semibold text-[#002d70] flex items-center gap-2">
        {{ title }}
      </h3>
      <button class="text-slate-400 hover:text-slate-600 transition-colors" (click)="onClose()">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    
    <div class="p-6 max-h-[70vh] overflow-y-auto">
      <ng-content></ng-content>
    </div>

    <div *ngIf="showFooter" class="px-6 py-4 border-t border-slate-200 bg-slate-50 flex justify-end gap-3">
      <button class="px-4 py-2 border border-slate-300 text-slate-700 font-label-md text-[13px] rounded hover:bg-slate-100 transition-colors" (click)="onClose()">
        {{ cancelText }}
      </button>
      <button [ngClass]="saveButtonClass ? saveButtonClass : 'px-6 py-2 bg-[#00429D] text-white font-label-md text-[13px] rounded hover:bg-blue-800 transition-colors shadow-sm'" (click)="onSave()">
        {{ saveText }}
      </button>
    </div>
  </div>
</div>
